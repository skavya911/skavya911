<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="CASE//ZERO: tap to play" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="220" fill="#10151c"/>
<g stroke="#2a3644" stroke-width="1"><path d="M0 55H800M0 110H800M0 165H800"/></g>
<polyline fill="none" stroke="#f2c14e" stroke-width="3" stroke-dasharray="1200" stroke-dashoffset="1200" points="0,170 80,150 160,160 240,120 320,130 400,180 480,195 560,140 640,110 720,80 800,60"><animate attributeName="stroke-dashoffset" from="1200" to="0" dur="3s" repeatCount="indefinite"/></polyline>
<circle r="5" fill="#ff6b57"><animateMotion dur="3s" repeatCount="indefinite" path="M0,170 L80,150 L160,160 L240,120 L320,130 L400,180 L480,195 L560,140 L640,110 L720,80 L800,60"/></circle>
<text x="32" y="80" fill="#e8eef5" font-family="Georgia,serif" font-size="46" font-weight="800">CASE//ZERO</text>
<text x="32" y="110" fill="#8a9bb0" font-family="monospace" font-size="15">Every number tells a story. Not every story is true.</text>
<rect x="32" y="130" width="150" height="34" rx="6" fill="#f2c14e"/>
<text x="107" y="152" fill="#1a1405" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">▶ TAP TO PLAY<animate attributeName="opacity" values="1;.5;1" dur="1.6s" repeatCount="indefinite"/></text>
</svg>
